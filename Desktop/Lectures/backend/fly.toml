# fly.toml app configuration file generated for mentor-pro on 2024-01-01T00:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about this file.
#

app = 'mentor-pro-production'
primary_region = 'iad'

[build]

[env]
  PORT = '3001'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
